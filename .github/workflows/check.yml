name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
      - uses: purcell/setup-emacs@master
        with:
          version: 30.2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            hunspell-en-us \
            libenchant-2-dev \
            pkg-config \
            shellcheck
      - name: Run quality suite
        run: make check
